<!DOCTYPE html>
<html lang="ko">
<head>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <style>
        :root {
            --primary: #4A90E2; --success: #51CF66; --bg: #F1F3F5; 
            --gold: #F1C40F; --danger: #FF6B6B; --card: #ffffff;
            --text-main: #2D3436; --text-sub: #636E72;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: 'Pretendard', sans-serif; background: var(--bg); margin: 0; 
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
            color: var(--text-main);
        }

        /* 헤더 스타일 개선 */
        header { padding: 15px 20px; background: white; border-bottom: 1px solid rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .header-title { margin: 0; font-size: 1.2rem; color: var(--primary); font-weight: 800; letter-spacing: -0.5px; }

        /* 상태 바 */
        .status-bar { padding: 12px 20px; display: flex; justify-content: space-between; background: #EBF4FF; font-size: 0.9rem; font-weight: 700; color: var(--primary); flex-shrink: 0; }

        /* 메인 레이아웃 */
        #main-display { flex: 1; padding: 10px 15px; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
        
        /* 지역 정보 카드 디자인 개선 */
        #region-info-card {
            background: var(--card); padding: 35px 20px; border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.03); text-align: center;
            min-height: 200px; display: flex; flex-direction: column; justify-content: center;
            border: 1px solid rgba(0,0,0,0.05); flex-shrink: 0; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
            
        #info-name { font-size: 1.4rem; font-weight: 850; color: var(--primary); margin-bottom: 15px; letter-spacing: -1px; }
        #info-desc { font-size: 0.8rem; color: var(--text-sub); line-height: 1.7; word-break: keep-all; font-weight: 500; }

        /* 로그 컨테이너 디자인 개선 */
        #live-log-container { 
            flex: 1; min-height: 100px; background: rgba(255,255,255,0.6); border-radius: 20px; border: 1px solid rgba(0,0,0,0.03); 
            display: flex; flex-direction: column; overflow: hidden; backdrop-filter: blur(10px);
        }
        .log-header { padding: 10px 15px; background: rgba(0,0,0,0.02); font-size: 0.75rem; font-weight: 800; color: #ADB5BD; border-bottom: 1px solid rgba(0,0,0,0.03); text-transform: uppercase; }
        #live-log-list { flex: 1; overflow-y: auto; padding: 12px 15px; font-size: 0.85rem; }
        .log-item { padding: 8px 0; border-bottom: 1px solid rgba(0,0,0,0.02); display: flex; align-items: flex-start; }
        .log-time { color: #CED4DA; margin-right: 10px; font-weight: 600; font-size: 0.75rem; padding-top: 2px; }

        /* 하단 조작 패널 */
        /* 기존 .controls 부분을 아래 코드로 교체하세요 */
        .controls { background: white; padding: 20px 20px 35px; border-radius: 32px 32px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,0.05); flex-shrink: 0; }
        #roulette-text { font-size: 1.4rem; font-weight: 900; color: var(--primary); height: 50px; display: flex; align-items: center; justify-content: center; background: #F8F9FA; border-radius: 16px; margin-bottom: 15px; border: 1px solid #F1F3F5; }
                    
        .btn-main { width: 100%; height: 50px; background: var(--primary); color: white; border: none; border-radius: 18px; font-size: 0.9rem; font-weight: 800; box-shadow: 0 4px 12px rgba(74, 144, 226, 0.3); transition: transform 0.1s; }
        .btn-main:active { transform: scale(0.98); }
        .btn-stop { background: var(--danger) !important; box-shadow: 0 4px 12px rgba(255, 107, 107, 0.3) !important; }

        /* 버튼 그리드 간격 조정 */
        .btn-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 15px; }
        
        /* 서브 버튼 크기 미세 조정 */
        .btn-sub { padding: 12px 2px; background: #F8F9FA; border: 1px solid #EDF2F7; border-radius: 12px; font-size: 0.7rem; font-weight: 700; color: #718096; }
       
        /* 모달 디자인 개선 */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 5000; backdrop-filter: blur(4px); padding: 15px; }
        .modal-content { background: white; padding: 25px; border-radius: 28px; width: 100%; max-width: 420px; text-align: center; max-height: 80vh; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        #modal-body { flex: 1; overflow-y: auto; }

        #login-page { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, var(--primary), #67B26F); z-index: 6000; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; padding: 40px; text-align: center; }
        #login-page h1 { font-size: 2.2rem; margin-bottom: 8px; font-weight: 900; letter-spacing: -1.5px; }
    </style>
</head>

            { threshold: 60, title: "🚌 여행의 달인", desc: "이제 웬만한 지역의 맛집은 다 꿰고 계시겠군요? (60% 돌파)" },
            { threshold: 70, title: "🚁 명예 가이드", desc: "사람들에게 여행지를 추천해 줄 수준입니다. (70% 돌파)" },
            { threshold: 80, title: "🦅 국토 수호자", desc: "대한민국의 거의 모든 공기를 마셔보셨네요! (80% 돌파)" },
            { threshold: 90, title: "🌟 살아있는 지도", desc: "눈을 감아도 전국 지도가 그려지는 경지입니다. (90% 돌파)" },
            { threshold: 100, title: "👑 전설의 탐험왕", desc: "249곳 완전 정복! 당신은 대한민국의 전설입니다! (100%)" }
        ];

        // 2. 독도 데이터
        const DOKDO_DATA = {
            name: "🇰🇷 대한민국 동쪽 끝, 독도",
            desc: "0.01%의 확률을 뚫고 동해의 외로운 섬, 독도를 뽑으셨습니다! 울릉도 동남쪽 87.4km에 위치한 독도는 천연기념물 제336호로 지정된 소중한 우리 영토입니다. 맑은 날씨와 천운이 따라야만 입도할 수 있는 이곳을 뽑으신 당신은 진정한 행운아입니다! 🌊⛰️"
        };

        // 3. 변수 추가 (기존 conquered 선언 근처에 추가)
        let hasDokdo = false;

        // 요청하신 로직으로 전면 수정
        const GOLD_KEYS = [
            { name: "꽝", type: "bad", desc: "꽝! 뽑힌 곳을 그대로 갑니다. 😱" },
            { name: "다시 돌리기", type: "retry", desc: "행운의 재도전! 지금 결과는 무효로 하고 다시 뽑습니다. 🔄" },
            { name: "지정 여행", type: "select", desc: "지정 여행 전체 지도에서 원하는 한 곳을 골라 이동하세요. ✈️" },
            { name: "휴식", type: "stay", desc: "꿀맛 같은 휴식! 이번은 여행 없이 집에서 쉽니다. ☕" },
            { name: "예산 제한", type: "budget", desc: "짠내 투어! 랜덤 예산 내에서 뽑힌 지역을 여행하세요. 💵" },
            { name: "교통수단 제한", type: "traffic", desc: "뚜벅이 미션! 대중교통으로만 뽑힌 지역을 여행하세요. 🚌" },
            { name: "현지인 맛집 추천", type: "local", desc: "정보 없이 떠나기! 현지인 맛집만 이용하며 여행하세요. 🍝" }
        ];

        let currentUser = null, conquered = new Set(), gameLogs = [], isRolling = false, spinTimer = null;

        function toggleRoulette() {
            if(isRolling) stopRoulette();
            else startRoulette();
        }

        function startRoulette() {
            isRolling = true;
            document.getElementById('roll-btn').innerText = "🛑 멈추기";
            document.getElementById('roll-btn').classList.add('btn-stop');
            document.getElementById('snd-spin').play();
            spinTimer = setInterval(() => {
                document.getElementById('roulette-text').innerText = REGION_DATA[Math.floor(Math.random()*249)+1].name;
            }, 50);
        }

        function stopRoulette() {
            clearInterval(spinTimer);
            document.getElementById('snd-spin').pause();
            let speed = 50;
            
            const slowdown = () => {
                document.getElementById('roulette-text').innerText = REGION_DATA[Math.floor(Math.random() * 249) + 1].name;
                if (speed < 400) { speed *= 1.3; setTimeout(slowdown, speed);
                } else {
                    // 독도 체크: 0.01% 확률 + 아직 독도 안 뽑았을 때
                    if (Math.random() <= 0.0001 && !hasDokdo) {
                        hasDokdo = true; // 이제 다시는 안 나옴
                        document.getElementById('roulette-text').innerText = "✨ 독도 발견! ✨";
                        document.getElementById('info-name').innerText = DOKDO_DATA.name;
                        document.getElementById('info-desc').innerText = DOKDO_DATA.desc;
                        document.getElementById('snd-gold').play();
                        addLog(`🎊 [특수] 평생 한 번뿐인 행운! 독도에 도착했습니다!`);
                        saveData();
                        document.getElementById('roll-btn').disabled = false;
                        document.getElementById('roll-btn').innerText = "🎲 여행지 추첨하기 🎲";
                    } else {
                        finalize(); // 일반 당첨 로직
                    }
                }
            };
            slowdown();
        }

        function finalize() {
            isRolling = false;
            document.getElementById('roll-btn').innerText = "🎲 여행지 추첨하기 🎲";
            document.getElementById('roll-btn').classList.remove('btn-stop');
            document.getElementById('snd-stop').play();

            const finalId = Math.floor(Math.random()*249)+1;

            if(Math.random() < 0.10) { // 10% 확률로 황금열쇠
                const key = GOLD_KEYS[Math.floor(Math.random()*GOLD_KEYS.length)];
                processKey(key, finalId);
            } else {
                executeConquer(finalId);
            }
        }

        function processKey(key, targetId) {
            document.getElementById('snd-gold').play();
            let body = `🗝️ [${key.name}]\n${key.desc}`;
            
            switch(key.type) {
                case 'bad': // 꽝: 뽑힌 곳 그대로 감
                    showPopup("😱 꽝!! ", body + `\n\n📍 대상: ${REGION_DATA[targetId].name}`, "var(--danger)");
                    executeConquer(targetId, " (꽝)");
                    break;
                case 'retry': // 다시 돌리기: 무효화 후 재추첨
                    showPopup("🗝️ 황금카드 미션", body + "\n\n현재 추첨 결과는 무효화됩니다. 다시 돌아갑니다. 🔄", "var(--primary)");
                    addLog(`황금카드: ${REGION_DATA[targetId].name} 무효 및 재추첨`);
                    setTimeout(startRoulette, 1800);
                    break;
                case 'stay': // 하루 쉬어가기: 지역 없이 휴식
                    showPopup("🗝️ 황금카드 미션", body, "var(--success)");
                    updateDisplay("이번 여행은 집에서 휴식! ☕", "즐거운 휴일 보내세요.", "var(--success)");
                    addLog("황금카드: 오늘 하루 쉬어가기");
                    break;
                case 'budget': // 예산 미션
                    const budget = (Math.floor(Math.random() * (30 - 15 + 1)) + 15) * 10000;
                    showPopup("🗝️ 황금카드 미션", `[예산 제한]\n미션 예산: ${budget.toLocaleString()}원 이내!\n\n📍 대상: ${REGION_DATA[targetId].name}`, "var(--gold)");
                    executeConquer(targetId, ` (예산:${budget.toLocaleString()}원 미션)`);
                    break;
                case 'traffic': // 교통 제한
                    showPopup("🗝️ 황금카드 미션", `[교통 제한]\n미션: 대중교통만 이용하세요!\n\n📍 대상: ${REGION_DATA[targetId].name}`, "var(--gold)");
                    executeConquer(targetId, " (대중교통 미션)");
                    break;
                case 'local': // 현지인 추천
                    showPopup("🗝️ 황금카드 미션", `[현지인 추천]\n미션: 현지인 추천 맛집만 이용하세요!\n\n📍 대상: ${REGION_DATA[targetId].name}`, "var(--gold)");
                    executeConquer(targetId, " (현지인 추천 미션)");
                    break;
                case 'select': // 지정 이동
                    showPopup("🗝️ 황금카드 당첨!", body, "var(--gold)");
                    addLog("황금카드: 지정 이동권 획득");
                    openMap(true);
                    break;
            }
        }

        function executeConquer(id, extra = "") {
            const region = REGION_DATA[id];
            if(conquered.has(id)) {
                updateDisplay(region.name, "이미 방문한 지역입니다! 다시 돌려주세요.", "var(--danger)");
                addLog(`중복 여행지: ${region.name}`);
            } else {
                conquered.add(id);
                updateDisplay(region.name, region.desc + extra, "var(--success)");
                addLog(`여행지 당첨: ${region.name}${extra}`);
                saveData(); updateProgress();
            }
        }

        function updateDisplay(name, desc, color) {
            document.getElementById('info-name').innerText = name;
            document.getElementById('info-desc').innerText = desc;
            document.getElementById('roulette-text').innerText = name;
            document.getElementById('region-info-card').style.borderColor = color;
            document.getElementById('region-info-card').style.transform = "scale(1.02)";
            setTimeout(() => { document.getElementById('region-info-card').style.transform = "scale(1)"; }, 200);
        }

        function addLog(msg) {
            const t = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            gameLogs.unshift({ t, msg });
            renderLogs();
        }

        function renderLogs() {
            document.getElementById('live-log-list').innerHTML = gameLogs.map(l => `
                <div class="log-item"><span class="log-time">${l.t}</span> <div>${l.msg}</div></div>
            `).join('');
        }

        function showPopup(title, msg, color = "var(--primary)") {
            document.getElementById('modal-body').innerHTML = `<h2 style="color:${color}; margin-top:0;">${title}</h2><p style="white-space:pre-line; line-height:1.7; font-size:1.05rem; color:#444;">${msg}</p>`;
            document.getElementById('modal').style.display = 'flex';
        }

        function openMap(selectMode = false) {
            let gridHtml = `<div style="display:grid; grid-template-columns:repeat(10, 1fr); gap:4px; padding:10px;">`;
            for(let i=1; i<=249; i++) {
                gridHtml += `<div onclick="handleMapClick(${i}, ${selectMode})" style="aspect-ratio:1; background:${conquered.has(i)?'var(--success)':'#EDF2F7'}; color:${conquered.has(i)?'white':'#CBD5E0'}; border-radius:4px; font-size:8px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-weight:700;">${i}</div>`;
            }
            gridHtml += `</div>`;
            showPopup(selectMode ? "📍 어디로 이동할까요?" : "🗺️ 전체 지도 현황", gridHtml);
        }

        function handleMapClick(i, selectMode) {
            const name = REGION_DATA[i].name;
            if(selectMode) {
                if(conquered.has(i)) return alert("이미 여행한 지역입니다!");
                if(confirm(`[${name}] 지역으로 즉시 이동하시겠습니까?`)) {
                    executeConquer(i, " (지정 이동)");
                    closeModal();
                }
            } else {
                alert(`${i}번: ${name}\n${conquered.has(i) ? '여행 완료 ✅' : '아직 여행 전 ❌'}`);
            }
        }

        function resetProgress() {
            if(confirm("주의! 모든 모험 기록과 로그가 초기화됩니다. 계속하시겠습니까?")) {
                conquered.clear(); gameLogs = [];
                saveData(); updateProgress(); renderLogs();
                updateDisplay("새로운 시작", "지도를 채워보세요!", "var(--bg)");
            }
        }

        function showKeyList() { showPopup("🗝️ 황금카드 정보", "• [황금열쇠: 꽝]\n• [황금열쇠: 다시 돌리기] 무효 후 자동 재추첨\n• [황금열쇠: 지정 여행] 전체 지도에서 선택\n• [황금열쇠: 휴식] 지역 정복 없이 휴식\n• [황금열쇠: 예산 제한] 지정된 예산으로 여행\n• [황금열쇠: 교통수단제한] 대중교통만으로 이동\n• [황금열쇠: 현지인 맛집] 현지인 추천 맛집 이용"); }
        function showRules() { showPopup("📜 게임 규칙", "1. 대한민국 지역을 카토그램식으로 나눈 지도형식입니다.\n2. 추첨 결과에 따른 지역을 여행합니다.\n3. 이미 정복한 곳은 다시 정복할 수 없습니다.\n4. 걸린 지역으로 무조건 여행을 떠나야 합니다.\n5. 황금카드는 10%의 확률로 등장합니다.\n6. 당일 여행 황금열쇠에 섬지역에 걸렸을 시 당일 여행은 무효처리 합니다.\n7. 기상악화 등 변수 발생 시 다음 기회로 미룹니다.\n8. 249개 전 지역을 여행하면 완료!"); }
        function showUpdates() { showPopup("📢 업데이트 v1.2", "• 지역에 대한 정보 업데이트\n• 다녀온 횟 수에 따른 업적 시스템 적용"); }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }
        function updateProgress() { 
            const total = 249;
            const count = conquered.size;
            const percent = Math.floor((count / total) * 100);

            // 상단 텍스트 업데이트
            document.getElementById('display-progress').innerText = `🗺️ 정복: ${count}/${total} (${percent}%)`;

            // 현재 퍼센트에 맞는 업적 찾기
            let currentAchieve = ACHIEVEMENTS[0];
            for (let i = ACHIEVEMENTS.length - 1; i >= 0; i--) {
                if (percent >= ACHIEVEMENTS[i].threshold) {
                    currentAchieve = ACHIEVEMENTS[i];
                    break;
                }
            }

            // 업적 UI 업데이트
            const badge = document.getElementById('achievement-badge');
            if (badge) {
                badge.innerText = `🏅 업적: ${currentAchieve.title}`;
                badge.title = currentAchieve.desc; // 마우스 오버 시 설명 표시
            }
        }
            
// [중요] saveData 함수를 아래 내용으로 교체
        function saveData() {
            if (!currentUser || !window.fb_db) return; // Firebase 준비 안 됐으면 중단
            const data = {
                conquered: Array.from(conquered),
                logs: gameLogs,
                hasDokdo: hasDokdo // 독도 획득 상태 포함
            };
            
            // Firebase에 데이터 쓰기 실행
            window.fb_set(window.fb_ref(window.fb_db, 'users/' + currentUser), data)
                .then(() => {
                    console.log("저장 성공!");
                })
                .catch((e) => {
                    console.error("저장 실패:", e);
                });
        }     

        function handleLogin() {
            const id = document.getElementById('user-id').value.trim();
            if(!id) return alert("닉네임을 입력하세요!");
            
            currentUser = id;
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('game-page').style.display = 'flex';
            document.getElementById('display-user').innerText = `👤 ${id}`;
// 데이터를 먼저 불러오고 화면을 갱신합니다.
            loadData(); 
        }
        
// 수정된 loadData 함수
        function loadData() {
            if (!currentUser || !window.fb_db) return;

            window.fb_get(window.fb_ref(window.fb_db, 'users/' + currentUser)).then((snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    conquered = new Set(data.conquered || []);
                    gameLogs = data.logs || [];
                    hasDokdo = data.hasDokdo || false; // 독도 획득 여부 불러오기
                    updateProgress();
                    renderLogs();
                    // console.log("데이터 로드 완료") -> 삭제해도 무방합니다.
                } else {
                    // 데이터가 없는 신규 유저일 경우 초기화
                    // console.log("기존 데이터 없음 - 초기화");
                    conquered = new Set();
                    gameLogs = [];
                    hasDokdo = false;
                    updateProgress();
                    renderLogs();
                }
            }).catch((e) => {
                console.error("로드 실패:", e);
                alert("데이터를 불러오지 못했습니다.");
            });
        }
    </script>
</body>
</html>
